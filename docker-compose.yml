services:
  app:
    image: ghcr.io/lyoraeth/lyoraeth:latest
    container_name: lyoraeth-app
    restart: unless-stopped
    # NUXT_PUBLIC_APP_VERSION/_APP_COMMIT_SHA live in .env itself (the deploy
    # step writes them there before `up`, under their real container names —
    # not `${VAR}` substitution here, which turned out to not reliably read
    # the shell that invoked compose). Not a build arg, so a rollback can
    # restore an older value without rebuilding the image.
    env_file: .env
    environment:
      # licensed woff2 live on the host, not in the image
      NUXT_FONTS_ROOT: /app/fonts
    # ./media — image variants written by the media:sync task; ./fonts — the
    # licensed woff2. Both bind-mounted so they survive a redeploy and stay
    # inspectable on the host.
    volumes:
      - ./media:/app/media
      - ./fonts:/app/fonts:ro
    networks:
      - server_network

  umami-db:
    image: postgres:16-alpine
    container_name: lyoraeth-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - server_network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: lyoraeth-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@lyoraeth-umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      - umami-db
    networks:
      - server_network

volumes:
  umami-db-data:

networks:
  server_network:
    external: true
