name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'darkstage-design-spec.md'
  # manual re-run of the current main, e.g. to retest after a diagnosis
  # without needing a throwaway commit
  workflow_dispatch:

# a second push landing mid-deploy would race the first on the VPS —
# queue instead of running both at once, and don't cancel a deploy that's
# already touching the live container
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/lyoraeth/lyoraeth

jobs:
  # Cheapest checks first: lint/typecheck/unit run in seconds with no
  # Docker and no browser. Nothing downstream starts if this fails.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Builds and pushes only the sha-tagged image — `latest` isn't touched
  # here, so it can never point at something that hasn't passed e2e yet.
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
      app_version: ${{ steps.version.outputs.version }}
      app_commit_sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # computeVersion.mjs replays the full commit history — a shallow
          # clone (the default) would silently produce a wrong, truncated
          # version instead of failing loudly
          fetch-depth: 0

      - name: Compute footer version
        id: version
        run: node scripts/computeVersion.mjs >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the actual image that would ship — not `pnpm dev` — against
  # real (public, read-only) Sanity content and Cloudflare's documented
  # always-pass Turnstile test keys.
  e2e:
    name: E2E against the built image
    runs-on: ubuntu-latest
    needs: build
    # worst case (every test individually hitting its 30s timeout) is
    # ~36 * 30s ≈ 18 minutes — this caps a genuine hang without needing a
    # manual cancel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dummy font stubs
        # the licensed woff2 files are deliberately kept out of the repo/image
        # (see Dockerfile) — content doesn't matter here, only that the font
        # route has something to serve instead of 404ing on every page load
        run: |
          mkdir -p /tmp/e2e-fonts
          touch /tmp/e2e-fonts/PPNeueMontreal-Medium.woff2
          touch /tmp/e2e-fonts/PPPangramSans-Semibold.woff2

      - name: Run the built image
        run: |
          docker run -d --name app-under-test -p 3000:3000 \
            -v /tmp/e2e-fonts:/app/fonts:ro \
            -e NUXT_FONTS_ROOT="/app/fonts" \
            -e NUXT_SANITY_PROJECT_ID="${{ vars.SANITY_PROJECT_ID }}" \
            -e NUXT_SANITY_DATASET="${{ vars.SANITY_DATASET }}" \
            -e NUXT_PUBLIC_TURNSTILE_SITE_KEY_CONTACT="1x00000000000000000000AA" \
            -e NUXT_TURNSTILE_SECRET_KEY_CONTACT="1x0000000000000000000000000000000AA" \
            -e NUXT_RESEND_API_KEY="dummy" \
            -e NUXT_MAILER_TO="dummy@example.com" \
            -e NUXT_PUBLIC_APP_VERSION="${{ needs.build.outputs.app_version }}" \
            -e NUXT_PUBLIC_APP_COMMIT_SHA="${{ needs.build.outputs.app_commit_sha }}" \
            "${{ needs.build.outputs.image }}"

      - name: Wait for the container to report healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' app-under-test 2>/dev/null || echo "missing")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "container never became healthy"
          docker logs app-under-test
          exit 1

      - name: Run Playwright
        # webServer.reuseExistingServer in playwright.config.ts sees the
        # container already answering on :3000 and skips spawning `pnpm dev`
        run: pnpm exec playwright test

      - name: Container logs on failure
        # cancelled(), not just failure(): a job killed by timeout-minutes
        # is "cancelled" in GitHub's terms, not "failed" - without this,
        # exactly the run that most needs these logs is the one that loses
        # them
        if: failure() || cancelled()
        run: docker logs app-under-test

      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop the test container
        if: always()
        run: docker rm -f app-under-test

  # `latest` only ever gets to point at an image that has already passed
  # e2e — no rebuild, just a registry-side retag of the exact manifest.
  promote:
    name: Promote to latest
    runs-on: ubuntu-latest
    needs: [build, e2e]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Tag the tested image as latest
        run: docker buildx imagetools create -t ${{ env.IMAGE }}:latest ${{ needs.build.outputs.image }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build, promote]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH, with auto-rollback on a failed health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -uo pipefail
            cd /root/lyoraeth || exit 1

            export APP_VERSION="${{ needs.build.outputs.app_version }}"
            export APP_COMMIT_SHA="${{ needs.build.outputs.app_commit_sha }}"

            # the image's digest and env are read straight off the running
            # container — nothing extra to keep in sync on the VPS, and it
            # survives fine even if this is the very first deploy (empty vars)
            PREV_IMAGE=$(docker inspect --format='{{.Image}}' lyoraeth-app 2>/dev/null)
            PREV_ENV=$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' lyoraeth-app 2>/dev/null)
            PREV_VERSION=$(echo "$PREV_ENV" | sed -n 's/^NUXT_PUBLIC_APP_VERSION=//p')
            PREV_SHA=$(echo "$PREV_ENV" | sed -n 's/^NUXT_PUBLIC_APP_COMMIT_SHA=//p')

            wait_healthy() {
              for _ in $(seq 1 30); do
                status=$(docker inspect --format='{{.State.Health.Status}}' lyoraeth-app 2>/dev/null)
                [ "$status" = "healthy" ] && return 0
                sleep 2
              done
              return 1
            }

            if ! docker compose pull app; then
              echo "pull failed — aborting, the running container is untouched"
              exit 1
            fi
            docker compose up -d app

            if wait_healthy && curl -sf -o /dev/null https://lyoraeth.art; then
              echo "deploy OK: $APP_VERSION ($APP_COMMIT_SHA)"
              docker image prune -f
              exit 0
            fi

            echo "health/smoke check failed — rolling back"
            if [ -z "$PREV_IMAGE" ]; then
              echo "no previous container to roll back to — manual intervention needed"
              exit 1
            fi

            docker tag "$PREV_IMAGE" ${{ env.IMAGE }}:latest
            export APP_VERSION="$PREV_VERSION"
            export APP_COMMIT_SHA="$PREV_SHA"
            docker compose up -d app

            if wait_healthy && curl -sf -o /dev/null https://lyoraeth.art; then
              echo "rolled back to $PREV_VERSION ($PREV_SHA)"
            else
              echo "rollback ALSO failed to become healthy — manual intervention needed"
            fi
            exit 1
