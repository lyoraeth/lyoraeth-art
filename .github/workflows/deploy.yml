name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'darkstage-design-spec.md'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/lyoraeth/lyoraeth

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      app_version: ${{ steps.version.outputs.version }}
      app_commit_sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # computeVersion.mjs replays the full commit history — a shallow
          # clone (the default) would silently produce a wrong, truncated
          # version instead of failing loudly
          fetch-depth: 0

      - name: Compute footer version
        id: version
        run: node scripts/computeVersion.mjs >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/lyoraeth
            export APP_VERSION="${{ needs.build.outputs.app_version }}"
            export APP_COMMIT_SHA="${{ needs.build.outputs.app_commit_sha }}"
            docker compose pull app
            docker compose up -d app
            docker image prune -f

      - name: Smoke test
        run: |
          sleep 10
          curl -sf -o /dev/null -w "%{http_code}" https://lyoraeth.art | grep -q "200\|301\|302" && echo "OK" || exit 1
